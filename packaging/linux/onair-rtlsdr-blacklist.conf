# Keeps the kernel's TV driver off RTL-SDR dongles (RTL2832U), so that OnAir can open them.
# Without this the kernel grabs the dongle as a DVB-T stick and the radio is "not found" or "busy".
# The list is the one of the rtl-sdr project (dvb_usb_rtl28xxu, e4000, rtl2832) plus the other RTL2832 modules of the kernel.
# Delete this file if you use the dongle as a TV stick with the kernel driver.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2830
blacklist rtl2832_sdr
blacklist e4000
