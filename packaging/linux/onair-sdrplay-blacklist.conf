# Keeps the kernel's Mirics drivers off SDRplay RSP radios, so that the SDRplay API (and OnAir) can see them.
# The RSPs are built around the Mirics MSi2500/MSi001 chips: without this the kernel grabs the radio at boot and the SDRplay API lists
# nothing until it is unplugged and plugged in again. SDRplay's own installer writes the same list.
# Delete this file if you use a Mirics-based TV stick with the kernel driver.
blacklist sdr_msi3101
blacklist msi001
blacklist msi2500
