# Licence and copyright for every file in this repository, kept in one place so that no source file has to be edited
# (see docs/PROVENANCE.md). Rules:
#  - Later [[annotations]] win over earlier ones (REUSE spec 3.x).
#  - precedence = "closest": a licence or copyright notice inside a file wins over the entry here, so files with their own
#    SPDX tags (for example android/gradlew) and the headers added later by tools/release/add_spdx.py stay as written.
#  - Third-party text is taken from the file headers and the licence files in each directory (third_party/*, THIRD_PARTY.md).
#    Where a licence could not be established it says LicenseRef-Unknown and the file is listed in docs/PROVENANCE.md.
#  - tools/release/check_spdx.py checks that every tracked file is covered (no network).

# ---------------------------------------------------------------- OnAir's own work (default)
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (C) 2026 Kristijonas Adomaitis and OnAir contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

