; OnAir ESP32 radio firmware. Build one board: pio run -e esp32dev   (or esp32-s3, esp32-c3, esp32-c6)
[platformio]
src_dir = onair_esp32

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+

[env:esp32dev]
board = esp32dev
[env:esp32-s3]
board = esp32-s3-devkitc-1
[env:esp32-c3]
board = esp32-c3-devkitm-1
[env:esp32-c6]
board = esp32-c6-devkitc-1
