name: Release

# Builds the installers when a version tag is pushed (git tag v0.1.0 && git push --tags) and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS disk image (${{ matrix.arch }})
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { arch: arm64, os: macos-15 }
          - { arch: x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkg-config hackrf soapysdr libusb ffmpeg glfw librtlsdr airspy airspyhf libbladerf limesuite uhd   # the radio libraries go into the app (tools/package/bundle_macos.py)
      - name: Build the app and the .dmg
        run: tools/package/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with: { name: "macos-dmg-${{ matrix.arch }}", path: build-release/*.dmg }

  linux:
    name: Linux ${{ matrix.arch }} packages
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # built on the oldest Ubuntu that is still supported: a program built on an old system runs on newer ones
          - { arch: x86_64, os: ubuntu-22.04 }
          - { arch: arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file cmake pkg-config nasm patchelf curl xz-utils libhackrf-dev libsoapysdr-dev libusb-1.0-0-dev libglfw3-dev libairspy0 libbladerf2 libiio0 liblimesuite20.10-1 libuhd4.1.0
      - name: Cache the static FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with: { path: ~/ffmpeg, key: "ffmpeg-8.0-static-${{ matrix.arch }}-${{ hashFiles('tools/package/build_ffmpeg_static.sh') }}" }
      - name: "Build FFmpeg (static, only what OnAir uses, so that the packages do not depend on the FFmpeg of the system they are installed on)"
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/package/build_ffmpeg_static.sh "$HOME/ffmpeg"
      - name: "Gather the radio libraries (RTL-SDR is built here from the RTL-SDR Blog source: the distribution's librtlsdr0 cannot drive the V4)"
        run: tools/package/collect_radio_libs_linux.sh "$GITHUB_WORKSPACE/build/radiolibs"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DDECT2_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON -DDECT2_FFMPEG_PREFIX="$HOME/ffmpeg" -DDECT2_RADIO_LIB_DIR="$GITHUB_WORKSPACE/build/radiolibs"
          cmake --build build -j 4 --target dect2 dect2cli dect2scan
      - name: Package
        run: |
          cd build && cpack -G DEB
          SRC="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/package/make_portable_linux.sh" "$PWD" "$PWD"
      - uses: actions/upload-artifact@v4
        with: { name: "linux-${{ matrix.arch }}", path: "build/onair_*.deb\nbuild/onair-*-portable.tar.gz" }

  # Windows: built on a Mac with tools/package/make_windows_cross.sh, which ships the RTL-SDR, Airspy, BladeRF and PlutoSDR
  # libraries and the SoapySDR drivers (MSYS2 has no packages for most of them, so a build here only had HackRF), then
  # attached with: gh release upload <tag> build-windows/OnAir-<version>-windows-x64.zip build-windows/OnAir-<version>-windows-x64-setup.exe

  publish:
    name: Attach to the release
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber || gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "OnAir ${GITHUB_REF_NAME}" --generate-notes --prerelease   # a release written by hand first only gets the files
