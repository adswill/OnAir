name: Release

# A version tag (git tag v0.2.6 && git push --tags) builds the installers and attaches them to that release.
# A push to a release branch (release-0.2.6) builds the same installers, deletes the previous beta of that
# version and publishes one replacement, tagged v0.2.6-beta.<commit count>. The beta tag does not start
# this workflow again.
on:
  push:
    tags:
      - 'v*'
      - '!v*-beta*'
    branches:
      - 'release-*'
      - '!release-*-pipeline-*'   # work branches on the release tooling must not publish a beta
  workflow_dispatch:

# A newer push on the same branch cancels the beta build still running, so an older beta is not published after it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      beta: ${{ steps.v.outputs.beta }}
      ver: ${{ steps.v.outputs.ver }}
      tag: ${{ steps.v.outputs.tag }}
      base: ${{ steps.v.outputs.base }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        run: |
          set -eu
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            base="${GITHUB_REF_NAME#v}"
            echo "beta=false" >> "$GITHUB_OUTPUT"
            echo "ver=${base}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "base=${base}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == release-* && "$GITHUB_EVENT_NAME" == push ]]; then   # a run started by hand on a release-* branch builds only, it publishes nothing
            base="${GITHUB_REF_NAME#release-}"
            n=$(git rev-list --count HEAD)
            echo "beta=true" >> "$GITHUB_OUTPUT"
            echo "ver=${base}-beta.${n}" >> "$GITHUB_OUTPUT"
            echo "tag=v${base}-beta.${n}" >> "$GITHUB_OUTPUT"
            echo "base=${base}" >> "$GITHUB_OUTPUT"
          else
            base=$(grep -m1 'project(' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
            echo "beta=false" >> "$GITHUB_OUTPUT"
            echo "ver=${base}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "base=${base}" >> "$GITHUB_OUTPUT"
          fi
      # tools/release/release.sh builds from the branch (this workflow started by hand), attaches everything to a DRAFT release and publishes it
      # on request. GitHub then creates the tag, which starts this workflow again: when the release is already public with its files there
      # is nothing to rebuild (a rebuild would replace the published files and drop the Windows and Android lines of SHA256SUMS).
      - id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            skip=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq 'if (.isDraft | not) and (.assets | length) >= 10 then "true" else "false" end' 2>/dev/null || echo false)
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  # Windows first in the workflow file so the cross build starts with macOS/Linux (same runner pool; long cached prefix).
  windows:
    name: Windows x64 package
    needs: version
    # Off by default: the dependency prefix (build-windows-deps/src) exists only on the maintainer's machines. The Windows files come from
    # package.yml in the private adswill/OnAir-ci (tools/release/release.sh). Set the repository variable ONAIR_WINDOWS_IN_ACTIONS=true to use this job.
    if: vars.ONAIR_WINDOWS_IN_ACTIONS == 'true' && needs.version.outputs.skip != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install cross toolchain
        run: |
          brew install cmake pkg-config nasm mingw-w64
          rustup target add x86_64-pc-windows-gnu   # the Rust protocol layers (rust/README.md) are linked into the exe
      - name: Cache Windows cross prefix
        id: winpfx
        uses: actions/cache@v6
        with:
          path: onair-win-prefix
          key: onair-win-prefix-${{ hashFiles('tools/package/cross_deps_windows.sh', 'packaging/windows/mingw-toolchain.cmake') }}
      - name: Build Windows dependencies
        if: steps.winpfx.outputs.cache-hit != 'true'
        env:
          ONAIR_WIN_PREFIX: ${{ github.workspace }}/onair-win-prefix
          ONAIR_WIN_WORK: ${{ runner.temp }}/onair-win-work
        run: |
          test -d build-windows-deps/src || { echo "error: build-windows-deps/src is missing (vendor tarballs for cross_deps_windows.sh)"; exit 1; }
          tools/package/cross_deps_windows.sh
      - name: Build Windows zip and installer
        env:
          ONAIR_WIN_PREFIX: ${{ github.workspace }}/onair-win-prefix
          ONAIR_WIN_BUILD: build-windows
        run: tools/package/make_windows_cross.sh "${{ needs.version.outputs.ver }}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            build-windows/OnAir-*-windows-x64.zip
            build-windows/OnAir-*-windows-x64-setup.exe

  macos:
    name: macOS disk image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { arch: arm64, os: macos-15 }
          - { arch: x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install cmake pkg-config nasm hackrf soapysdr soapyremote libusb glfw librtlsdr airspy airspyhf libbladerf limesuite uhd hamlib openssl@3   # radio libraries and Hamlib go into the app (tools/package/bundle_macos.py)
      # No Homebrew FFmpeg (it is --enable-gpl): the LGPL shared build of tools/package/build_ffmpeg.sh, cached per architecture and script version
      - name: Cache the shared FFmpeg
        id: ffmpeg
        uses: actions/cache@v6
        with: { path: ~/ffmpeg, key: "ffmpeg-8.0-shared-macos-${{ matrix.arch }}-${{ hashFiles('tools/package/build_ffmpeg.sh') }}" }
      - name: Build FFmpeg (LGPL, shared, only what OnAir uses)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/package/build_ffmpeg.sh "$HOME/ffmpeg"
      - name: Build the app and the .dmg
        run: FFMPEG_PREFIX="$HOME/ffmpeg" tools/package/make_dmg.sh "${{ needs.version.outputs.ver }}"
      - uses: actions/upload-artifact@v7
        with: { name: "macos-dmg-${{ matrix.arch }}", path: build-release/*.dmg }

  linux:
    name: Linux ${{ matrix.arch }} packages
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # built on the oldest Ubuntu that is still supported: a program built on an old system runs on newer ones
          - { arch: x86_64, os: ubuntu-22.04 }
          - { arch: arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file desktop-file-utils cmake pkg-config ccache nasm patchelf curl xz-utils libhackrf-dev libsoapysdr-dev libusb-1.0-0-dev libglfw3-dev libairspy0 libbladerf2 libiio0 liblimesuite20.10-1 libuhd4.1.0 libhamlib-dev libssl-dev
      - name: Cache the shared FFmpeg
        id: ffmpeg
        uses: actions/cache@v6
        with: { path: ~/ffmpeg, key: "ffmpeg-8.0-shared-${{ matrix.arch }}-${{ hashFiles('tools/package/build_ffmpeg.sh') }}" }
      - name: "Build FFmpeg (shared, shipped in the packages, only what OnAir uses, so that the packages do not depend on the FFmpeg of the system they are installed on)"
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/package/build_ffmpeg.sh "$HOME/ffmpeg"
      - name: "Gather the radio libraries (RTL-SDR is built here from the RTL-SDR Blog source: the distribution's librtlsdr0 cannot drive the V4)"
        run: tools/package/collect_radio_libs_linux.sh "$GITHUB_WORKSPACE/build/radiolibs"
      - uses: actions/cache@v6   # ccache, same scheme as ci.yml; separate cache per architecture
        with:
          path: .ccache
          key: ccache-release-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-release-${{ matrix.arch }}-
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPRESS: "true"
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DDECT2_BUILD_TESTS=ON -DDECT2_HAVE_HAMLIB=ON -DDECT2_WITH_TLS=ON -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON -DDECT2_FFMPEG_PREFIX="$HOME/ffmpeg" -DDECT2_RADIO_LIB_DIR="$GITHUB_WORKSPACE/build/radiolibs" -DONAIR_VERSION="${{ needs.version.outputs.ver }}"
          cmake --build build -j 4 --target dect2 dect2cli dect2scan onair-server
          ccache -s
      - name: Package
        run: |
          cd build && cpack -G DEB
          SRC="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tools/package/make_portable_linux.sh" "$PWD" "$PWD"
      - name: "AppImage (one file; OnAir updates it in place without root)"
        run: |
          set -eu
          case "$(uname -m)" in x86_64) AT=x86_64 ;; aarch64) AT=aarch64 ;; *) echo "no appimagetool for $(uname -m)"; exit 1 ;; esac
          curl -fsSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-$AT.AppImage"
          chmod +x /tmp/appimagetool
          printf '#!/bin/sh\nexec /tmp/appimagetool --appimage-extract-and-run "$@"\n' > /tmp/appimagetool-run; chmod +x /tmp/appimagetool-run
          cd build && APPIMAGETOOL=/tmp/appimagetool-run "$GITHUB_WORKSPACE/tools/package/make_appimage.sh" "$PWD"/onair-*-portable.tar.gz "$PWD"
      - name: Smoke test (the portable package starts, draws one frame and exits) and size report
        run: |
          set -eu
          sudo apt-get install -y xvfb libgl1-mesa-dri
          T=$(ls build/onair-*-portable.tar.gz); mkdir -p smoke && tar xzf "$T" -C smoke
          D=$(ls -d smoke/onair-*-portable)
          export HOME="$PWD/smoke/home"; mkdir -p "$HOME"
          timeout 180 xvfb-run -a -s "-screen 0 1280x800x24" "$D/bin/onair" --hidden --mute --no-first-run --shot "$PWD/smoke/shot.png"
          test "$(stat -c %s smoke/shot.png)" -gt 10000
          dpkg-deb -I build/onair_*.deb | head -12
          { echo "### Linux ${{ matrix.arch }} sizes"; echo '```'; ls -l build/onair_*.deb build/onair-*-portable.tar.gz build/OnAir-*.AppImage; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: { name: "linux-${{ matrix.arch }}", path: "build/onair_*.deb\nbuild/onair-*-portable.tar.gz\nbuild/OnAir-*.AppImage" }

  # Windows: built on a Mac with tools/package/make_windows_cross.sh, which ships the RTL-SDR, Airspy, BladeRF and PlutoSDR
  # libraries and the SoapySDR drivers (MSYS2 has no packages for most of them, so a build here only had HackRF), then
  # attached with: gh release upload <tag> build-windows/OnAir-<version>-windows-x64.zip build-windows/OnAir-<version>-windows-x64-setup.exe
  publish:
    name: Attach to the release
    # macOS/Linux first; Windows attaches in attach-windows (long cross build, must not block the beta).
    needs: [version, macos, linux]
    if: (startsWith(github.ref, 'refs/tags/v') || (startsWith(github.ref, 'refs/heads/release-') && github.event_name == 'push')) && needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ needs.version.outputs.beta }}
          TAG: ${{ needs.version.outputs.tag }}
          BASE: ${{ needs.version.outputs.base }}
        run: |
          set -euo pipefail
          # SHA256SUMS: the checksums of every package, for the update check's fallback when api.github.com is blocked but github.com works
          # (users behind a mirror). The Windows files are added by the attach-windows job.
          (cd dist && sha256sum * | grep -v ' SHA256SUMS$' > SHA256SUMS)
          # One beta per version. A new push deletes the previous beta, including its tag, before publishing the replacement.
          # An official tag deletes that beta too, so the finished release is the one people are offered.
          prefix="v${BASE}-beta"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | while read -r t; do
            [ -n "$t" ] || continue
            [ "$t" = "$TAG" ] && continue
            case "$t" in
              "$prefix"|"$prefix."*) gh release delete "$t" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" ;;
            esac
          done
          if [ "$BETA" = "true" ]; then
            notes="Test build of ${BASE} (${GITHUB_SHA}). This replaces the previous beta. The finished release is still to come."
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "OnAir ${BASE} beta" --notes "$notes" --prerelease --draft   # a draft until Windows and the APK are attached
            fi
          else
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber \
              || gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "OnAir ${TAG}" --generate-notes --draft   # a draft: it goes public only once every asset is attached
          fi

  attach-windows:
    name: Attach Windows to the release
    needs: [version, publish, windows]
    if: |
      (startsWith(github.ref, 'refs/tags/v') || (startsWith(github.ref, 'refs/heads/release-') && github.event_name == 'push')) &&
      needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { name: windows-x64, path: dist }
      - name: Upload Windows zip and installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # add the Windows checksums to the SHA256SUMS the publish job attached
          mkdir -p sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D sums || : > sums/SHA256SUMS
          (cd dist && sha256sum *) >> sums/SHA256SUMS
          gh release upload "$TAG" dist/* sums/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
  # The Docker image (packaging/docker) of a finished release, for amd64 and arm64: ghcr.io/<owner>/onair:<version> and :latest.
  # Not for betas: they would rebuild it at every push to a release branch. It installs this run's own .deb (packaging/docker/debs).
  docker:
    name: Docker image
    needs: [version, publish]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta') && (needs.publish.result == 'success' || needs.version.outputs.skip == 'true') }}   # a run started by hand on a beta tag must not become :latest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8   # this run's own .debs: the release is still a draft here, so its assets cannot be downloaded anonymously
        with: { pattern: "linux-*", path: packaging/docker/debs, merge-multiple: true }
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/onair" >> "$GITHUB_OUTPUT"   # registry names are lower case
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6   # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: packaging/docker
          platforms: linux/amd64,linux/arm64
          build-args: ONAIR_VERSION=${{ needs.version.outputs.ver }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.version.outputs.ver }}
            ${{ steps.img.outputs.name }}:latest
