# Full check: every platform and code path, all tests including the slow ones.
# CI normally runs locally (tools/ci_local.sh --full); this one only runs by hand: Actions tab > Full CI > Run workflow.
name: Full CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"   # nightly: only the slow tier (ctest -L slow)

# ccache as in ci.yml (see the comment there for the cache keys); one cache per job/matrix entry.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64", os: ubuntu-24.04, extra: "" }
          - { name: "Linux arm64", os: ubuntu-24.04-arm, extra: "" }
          - { name: "Linux x86_64 (scalar code paths)", os: ubuntu-24.04, extra: "-DDECT2_NO_SIMD=ON" }
          - { name: "macOS arm64", os: macos-15, extra: "" }
          - { name: "macOS Intel (x86_64)", os: macos-15-intel, extra: "" }
          - { name: "macOS arm64 (portable DSP, no SIMD)", os: macos-15, extra: "-DDECT2_PORTABLE=ON -DDECT2_NO_SIMD=ON" }
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ccache libhackrf-dev libsoapysdr-dev libusb-1.0-0-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config nasm ccache hackrf soapysdr libusb ffmpeg glfw
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-full-${{ strategy.job-index }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-full-${{ strategy.job-index }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-full-${{ strategy.job-index }}-
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: ccache statistics
        if: always()
        run: ccache -s
      - name: Test
        run: ctest --test-dir build -j 4 ${{ github.event_name == 'schedule' && '-L slow' || '' }} --output-on-failure --timeout 1500

  windows:
    name: Windows x64 (MinGW-w64)
    runs-on: windows-2022
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64   # the MINGW64 environment has no hackrf and soapysdr packages
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-glfw mingw-w64-ucrt-x86_64-hackrf mingw-w64-ucrt-x86_64-soapysdr mingw-w64-ucrt-x86_64-libiconv
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-full-windows-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-full-windows-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-full-windows-
      - name: Configure and build (app, tools, tests)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j 4
      - name: ccache statistics
        if: always()
        run: ccache -s
      - name: Test
        run: ctest --test-dir build -j 4 ${{ github.event_name == 'schedule' && '-L slow' || '' }} --output-on-failure --timeout 1500

  app:
    name: GUI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64, OpenGL", os: ubuntu-24.04, extra: "" }
          - { name: "Linux arm64, OpenGL", os: ubuntu-24.04-arm, extra: "" }
          - { name: "macOS arm64, Metal", os: macos-15, extra: "" }
          - { name: "macOS arm64, OpenGL", os: macos-15, extra: "-DDECT2_UI_BACKEND=OpenGL3" }
          - { name: "macOS Intel, Metal", os: macos-15-intel, extra: "" }
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ccache libhackrf-dev libsoapysdr-dev libusb-1.0-0-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libglfw3-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config ccache hackrf soapysdr libusb ffmpeg glfw
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-app-${{ strategy.job-index }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-app-${{ strategy.job-index }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-app-${{ strategy.job-index }}-
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DDECT2_BUILD_TESTS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.extra }}
      - name: Build the app
        run: cmake --build build -j 4 --target dect2
      - name: ccache statistics
        if: always()
        run: ccache -s
      - name: Test macOS packaging checks
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tools/package -p 'test_*.py' -v
      - name: Cache the LGPL shared FFmpeg (the disk image uses it, not Homebrew's GPL build)
        if: runner.os == 'macOS' && matrix.extra == ''
        uses: actions/cache@v6
        with: { path: ~/ffmpeg, key: "ffmpeg-8.0-shared-macos-${{ runner.arch }}-${{ hashFiles('tools/package/build_ffmpeg.sh') }}" }
      - name: Build and validate the macOS disk image
        if: runner.os == 'macOS' && matrix.extra == ''
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          FFMPEG_PREFIX: /Users/runner/ffmpeg
        run: tools/package/make_dmg.sh
