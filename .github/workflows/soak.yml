# Soak tests: the 10 minute session-writer soak and a run of onair-server on its test signal, watching memory and threads through /api/v1/metrics.
# Weekly and by hand (Actions tab > Soak > Run workflow). Never a PR gate.
name: Soak

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes for the server soak"
        default: "60"
  schedule:
    - cron: "11 5 * * 0"

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: "true"

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-soak-${{ github.run_id }}
          restore-keys: ccache-soak-
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j 4 --target onair-server soak_session_writer
      - name: Session writer soak (10 minutes)
        run: build/soak_session_writer --seconds 600
      - name: Server soak
        env: { MINUTES: "${{ inputs.minutes || '60' }}" }
        run: python3 tools/soak/soak_server.py --server build/onair-server --minutes "$MINUTES" --interval 30 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache
          key: ccache-soak-${{ github.run_id }}
