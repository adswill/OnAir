# Android app (android/): builds the APK. It never publishes anything: the APK is a workflow artifact only.
#  - a version tag (v0.3.0, v0.3.0-beta.1) and "Run workflow" by hand: libonair.so (the desktop core for arm64-v8a, Rust included) +
#    the signed release APK. Signing comes from repository secrets (android/README.md, "Signing"); without them the APK is unsigned.
#  - a push to an android-* branch that touches android/: a quick check without the native library (JNI table, Kotlin compile,
#    debug APK), so the Android work can be tested on GitHub instead of a laptop.
name: Android

on:
  push:
    tags: ['v*']
    branches: ['android-*']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      native:
        description: "Build libonair.so and the release APK (off: quick Kotlin-only debug build)"
        type: boolean
        default: true
      debug:
        description: "Debug APK with the native library (never uses the signing key; for testing a branch)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ccache around the core's compile (CMake uses it when it is installed); restored from the newest older run, saved also when the run fails
env:
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: "true"

  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.31.5"

jobs:
  check:
    name: Kotlin check (no native library)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') || (github.event_name == 'workflow_dispatch' && !inputs.native && !inputs.debug)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c   # v5.0.2
      - name: JNI declarations match the C++ bridge
        run: python3 tools/check_jni.py
      - name: Scripts
        run: bash -n tools/build_native.sh && python3 -m py_compile tools/*.py
      - name: The generated mode list and results are current
        run: |
          python3 tools/gen_modes.py && python3 tools/gen_results_map.py
          git diff --exit-code -- tools/mode_order.txt app/src/main/res/values/modes.xml app/src/main/java/io/github/adswill/onair/Modes.kt native/src/results_generic_map.inc
      - name: Debug APK (Kotlin compile, resources, manifest)
        run: ./gradlew --no-daemon assembleDebug
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with: { name: onair-android-debug-no-native, path: android/app/build/outputs/apk/debug/*.apk, retention-days: 7 }

  apk:
    name: Release APK (arm64-v8a)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.native || inputs.debug))
    runs-on: macos-15            # the maintainer's own build host: Homebrew gives the pkg-config headers the core configures with
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c   # v5.0.2
      - name: Build tools and headers
        # only headers are used for Android (android/native/src/stubs_ext.c stands in for the libraries)
        run: tools/release/retry.sh brew install pkg-config ccache hackrf libusb ffmpeg
      - name: Rust with the Android target
        run: |
          # (rustup's cargo first on the PATH: only rustup can add the Android target)
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          tools/release/retry.sh rustup toolchain install stable --profile minimal
          rustup default stable
          tools/release/retry.sh rustup target add aarch64-linux-android
      - name: NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          tools/release/retry.sh "$SDKM" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "CMAKE=$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" >> "$GITHUB_ENV"
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "ONAIR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: libusb source (official tag, for the USB radios; own empty folder, nothing from it is run)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/libusb-src"
          tools/release/retry.sh git clone --depth 1 --branch v1.0.27 https://github.com/libusb/libusb "$RUNNER_TEMP/libusb-src"
          echo "libusb v1.0.27 commit $(git -C "$RUNNER_TEMP/libusb-src" rev-parse HEAD)"
          echo "LIBUSB_SRC=$RUNNER_TEMP/libusb-src" >> "$GITHUB_ENV"
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-android-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'android/native/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'android/native/CMakeLists.txt') }}-
            ccache-android-
      - name: libonair.so (core + JNI bridge)
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: JOBS=$(sysctl -n hw.ncpu) android/tools/build_native.sh
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-android-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'android/native/CMakeLists.txt') }}-${{ github.sha }}
      - name: Debug APK (no signing key)
        if: github.event_name == 'workflow_dispatch' && inputs.debug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.debug
        with: { name: onair-android-debug, path: android/app/build/outputs/apk/debug/*.apk, retention-days: 7 }
      # Signing only when the secrets exist (android/README.md, "Signing"). The keystore never goes in the log or an artifact: it is decoded to the
      # runner's temp folder for the one Gradle step, the passwords reach only that step, and the file is removed afterwards whatever happened.
      - name: Signing key from secrets
        id: signing
        if: github.event_name != 'workflow_dispatch' || !inputs.debug
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is built unsigned"; echo "have=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          umask 077
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/onair-release.jks"
          echo "have=true" >> "$GITHUB_OUTPUT"
      # Two steps because an empty ONAIR_STORE_FILE would count as a keystore path in android/app/build.gradle.kts
      - name: Release APK (signed)
        if: (github.event_name != 'workflow_dispatch' || !inputs.debug) && steps.signing.outputs.have == 'true'
        working-directory: android
        env:
          ONAIR_STORE_FILE: ${{ runner.temp }}/onair-release.jks
          ONAIR_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ONAIR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ONAIR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Release APK (unsigned, no signing secrets)
        if: (github.event_name != 'workflow_dispatch' || !inputs.debug) && steps.signing.outputs.have != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Remove the signing key
        if: always() && steps.signing.outputs.have == 'true'
        run: rm -f "$RUNNER_TEMP/onair-release.jks"
      - name: Name the APK
        if: github.event_name != 'workflow_dispatch' || !inputs.debug
        run: |
          V="${ONAIR_VERSION:-$(grep -m1 -oE 'project\(OnAir VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')}"
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            case "$f" in *unsigned*) cp "$f" "out/OnAir-$V-android-unsigned.apk" ;; *) cp "$f" "out/OnAir-$V-android.apk" ;; esac
          done
          ls -la out
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'workflow_dispatch' || !inputs.debug
        with: { name: onair-android-apk, path: out/*.apk, retention-days: 30 }
