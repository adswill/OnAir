# ccache warm-up for every branch (docs/CI-FAST.md (4.7)). GitHub lets a branch restore only its own caches and those of main, so this builds
# main, the base of every new branch, on Linux, macOS and Windows with the exact flags of ci.yml's shards and saves the cache on main.
# Without it the macOS and Windows shards of a new branch compiled all 5000 files from nothing (55 and 63 min, run 45136260924), and the
# Linux one restored a cache of a stale integration branch.
# Runs after every push to main (a newer push cancels the older run; what was compiled is still saved) and nightly. The last job deletes
# the older copies of each cache family, so the repository stays under GitHub's 10 GB and the newest caches are not evicted (10.7 GB used
# on 2026-11-27, two copies of most families).
name: ccache warm-up

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'LICENSE*']
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:

concurrency:
  group: ccache-warm
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # the prune job deletes old cache entries

env:   # as ci.yml
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_SLOPPINESS: "time_macros,pch_defines,include_file_mtime,include_file_ctime"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  unix:
    name: warm (${{ matrix.plat }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plat: linux, os: ubuntu-24.04 }
          - { plat: macos, os: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Linux, in the background)
        if: runner.os == 'Linux'
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: tools/release/retry.sh brew install cmake ninja pkg-config ccache hackrf soapysdr libusb ffmpeg glfw
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-warm-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.plat }}-warm-
      - name: Build every test and the app with the flags of ci.yml
        run: |
          LD=""; [ "$RUNNER_OS" = Linux ] && LD="-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DCMAKE_TEST_LAUNCHER=python3;$PWD/tools/ci_testtime.py" $LD
          python3 tools/ci_select.py --build-dir build --scope full --out sel
          ccache -z
          cmake --build build -j 4 --target $(tr -d "\r" < sel/targets.txt) dect2
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/cache/save@v6
        if: always()   # also a cancelled or failed run: what it compiled is reused
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-warm-${{ github.run_id }}

  windows:
    name: warm (windows)
    runs-on: windows-2022
    timeout-minutes: 150
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:   # as ci.yml's Windows shards
          msystem: UCRT64
          update: true
          install: >-
            git python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-glfw mingw-w64-ucrt-x86_64-hackrf mingw-w64-ucrt-x86_64-soapysdr mingw-w64-ucrt-x86_64-libiconv mingw-w64-ucrt-x86_64-python
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-windows-warm-${{ github.run_id }}
          restore-keys: ccache-windows-warm-
      - name: Build every test and the app with the flags of ci.yml
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          python tools/ci_select.py --build-dir build --scope full --no-slow --out sel
          ccache -z
          cmake --build build -j 4 --target $(tr -d "\r" < sel/targets.txt) dect2
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache
          key: ccache-windows-warm-${{ github.run_id }}

  # the newest entry of each cache family stays; the older copies go (a family: the key without its run id or commit hash)
  prune:
    needs: [unix, windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Delete the older copies of each cache family
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 tools/ci_cache_prune.py --repo "$GITHUB_REPOSITORY"
