# Quick check: builds the app, tools and tests on Linux, macOS and Windows and runs the fast tests in
# parallel. The slow tests and the other code paths run in ci-full.yml. It runs on every push to the 0.2.7
# branch and by hand (Actions tab > CI > Run workflow), so the builds and tests do not have to run on a laptop.
name: CI

on:
  push:
    branches: ['main', '0.2.8']
  workflow_dispatch:

# A newer push cancels the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build cache (ccache, wrapped around every C/C++ compile via CMAKE_*_COMPILER_LAUNCHER):
#  - the cache key is os + hash of CMakeLists.txt/cmake/** + the commit; the commit never matches an old run, so the
#    restore-keys prefixes pick the newest cache of the same os (then the same CMake inputs) and only changed files recompile;
#  - CCACHE_BASEDIR makes paths relative so a checkout in another directory still hits; compression keeps the cache small;
#  - the Rust layers build with cargo inside build/rust from workspace sources only (no crates to download), and cargo
#    decides by file mtime, which a fresh checkout resets, so caching its target dir would never hit and is left out.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"

jobs:
  lint:
    name: Lint (seconds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax
        run: for f in tools/*.sh; do bash -n "$f" || exit 1; done
      - name: Workflow YAML syntax
        run: python3 -c "import sys,yaml;[yaml.safe_load(open(f)) for f in sys.argv[1:]]" .github/workflows/*.yml
      - name: Python syntax
        run: python3 -m py_compile tools/*.py
      - name: FFI width check
        run: python3 tools/check_ffi_widths.py

  unix:
    needs: lint
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64", os: ubuntu-24.04 }
          - { name: "macOS arm64", os: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ccache libhackrf-dev libsoapysdr-dev libusb-1.0-0-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libglfw3-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config ccache hackrf soapysdr libusb ffmpeg glfw
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ matrix.os }}-
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j 4
      - name: ccache statistics
        if: always()
        run: ccache -s
      # the socket / thread timing tests (label "timing") on their own, two at a time, a failed one run once more: beside a -j 4 run they
      # measured the runner's load. (A retry step after a failed test step never ran: a step only runs when the ones before it passed.)
      - name: Test (fast tests)
        run: ctest --test-dir build -j 4 -LE "slow|timing" --output-on-failure --timeout 600 --output-log ctest-fast.log
      - name: Test (timing tests, a failure retried once)
        if: success() || failure()
        run: ctest --test-dir build -j 2 -L timing -LE slow --repeat until-pass:2 --output-on-failure --timeout 600 --output-log ctest-timing.log
      # the speed figures of every test (tests/common/cpu_report.h), also of those that passed: for calibrating the limits on these machines
      - name: CPU figures (CPUCAL)
        if: always()
        run: grep -h CPUCAL ctest-fast.log ctest-timing.log > cpucal.txt || true; cat cpucal.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "cpucal-${{ matrix.name }}", path: "cpucal.txt\nctest-fast.log\nctest-timing.log", if-no-files-found: ignore }
      # The app on Mesa's software OpenGL held to 3.1 and a 4096 texture limit, as on a Raspberry Pi 4/5 (#283, #284): it must open,
      # draw a frame and make no GL errors.
      - name: "App: OpenGL 3.1 software run (Raspberry Pi limits)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.1 MESA_GLSL_VERSION_OVERRIDE=140 MESA_DEBUG=1 DECT2_MAX_TEXTURE=4096 \
            timeout 120 xvfb-run -a -s "-screen 0 1600x1000x24" ./build/dect2 --hidden --mute --shot "$GITHUB_WORKSPACE/shot-gl31.png" > gl31.log 2>&1
          echo "exit $?"
          cat gl31.log | tail -40
          [ -f "$GITHUB_WORKSPACE/shot-gl31.png" ] || { echo "no frame drawn"; exit 1; }
          if grep -q 'Mesa: error\|GL_INVALID' gl31.log; then echo "OpenGL errors"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with: { name: linux-gl31-shot, path: "shot-gl31.png\ngl31.log", if-no-files-found: ignore }

  windows:
    name: Windows x64 (MinGW-w64)
    runs-on: windows-2022
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64   # the MINGW64 environment has no hackrf and soapysdr packages
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-glfw mingw-w64-ucrt-x86_64-hackrf mingw-w64-ucrt-x86_64-soapysdr mingw-w64-ucrt-x86_64-libiconv
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-windows-
      - name: Configure and build (app, tools, tests)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j 4
      - name: ccache statistics
        if: always()
        run: ccache -s
      # the socket / thread timing tests (label "timing") on their own, two at a time, a failed one run once more: beside a -j 4 run they
      # measured the runner's load. (A retry step after a failed test step never ran: a step only runs when the ones before it passed.)
      - name: Test (fast tests)
        run: ctest --test-dir build -j 4 -LE "slow|timing" --output-on-failure --timeout 600 --output-log ctest-fast.log
      - name: Test (timing tests, a failure retried once)
        if: success() || failure()
        run: ctest --test-dir build -j 2 -L timing -LE slow --repeat until-pass:2 --output-on-failure --timeout 600 --output-log ctest-timing.log
      # the speed figures of every test (tests/common/cpu_report.h), also of those that passed: for calibrating the limits on these machines
      - name: CPU figures (CPUCAL)
        if: always()
        run: grep -h CPUCAL ctest-fast.log ctest-timing.log > cpucal.txt || true; cat cpucal.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "cpucal-Windows x64", path: "cpucal.txt\nctest-fast.log\nctest-timing.log", if-no-files-found: ignore }
