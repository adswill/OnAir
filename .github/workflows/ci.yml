# Quick check: builds ONLY the test programs the change can affect (tools/ci_select.py) and runs them, spread over shards that run at the
# same time. How it picks (docs/CI-FAST.md):
#   scope auto    changed files -> test areas (core/src/<mode>/, app/<mode>/, tests/<mode>/ -> tests/<mode>/) + a small smoke set;
#                 a shared file (dsp, engine, CMake, headers ...) -> every non-slow test
#   scope full    every test including the slow ones (tags, and the manual input)
# The three "Linux x86_64", "macOS arm64" and "Windows x64 (MinGW-w64)" jobs at the end are the required checks: they only gather the shards.
# Every job waits for "Lint (seconds)", which is the quick gate (tools/gate/run.sh, docs/CI-FAST.md).
name: CI

on:
  push:
    branches: ['main', '0.2.8', 'integ-*']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'website/**', 'LICENSE*']   # a docs-only push builds nothing (tags are not filtered)
  schedule:
    - cron: "17 2 * * *"   # nightly: the full scope (every test incl. the slow tier on Linux), replaces the 6-hour jobs of ci-full.yml (docs/CI-FAST.md (4.7))
  workflow_dispatch:
    inputs:
      scope:
        description: "auto (changed areas), wide (all non-slow), full (all incl. slow), smoke"
        default: auto
      base:
        description: "git ref the change is measured against (auto scope)"
        default: origin/main
      platforms:
        description: "all, or linux: the Linux shards only (a worker's check of a wide change; docs/CI-FAST.md (4.7))"
        default: all
      long:
        description: "true: the long form of the tests (ONAIR_TEST_LONG=1, as on tags and the nightly Full CI)"
        default: "false"

# A newer push cancels the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ccache around every compile; one cache per os + shard (the shards build different files), restored from the newest older one,
# saved also when the run failed. Paths are made relative (BASEDIR) so another checkout directory still hits.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_SLOPPINESS: "time_macros,pch_defines,include_file_mtime,include_file_ctime"
  SCOPE: ${{ inputs.scope || ((startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule') && 'full') || 'auto' }}
  TEST_TIMEOUT: ${{ (inputs.scope == 'full' || startsWith(github.ref, 'refs/tags/')) && '1500' || '600' }}
  BASE_IN: ${{ inputs.base || github.event.before }}
  # the long form of the shortened tests (tests/common/test_long.h): release tags and the nightly Full CI; docs/CI-SPEED-3.9.md
  ONAIR_TEST_LONG: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.long == 'true') && '1' || '' }}
  # ccache is saved only by main and the integration branches: a feature branch's own copy filled the 10 GB of the repository and pushed
  # the integration caches out (cache usage 10.7 GB, 2026-11-10); feature branches restore main's (the nightly warm-up of ci-full.yml)
  SAVE_CACHE: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integ-')) && '1' || '' }}
  # every test's wall and CPU seconds (tools/ci_testtime.py, the ctest launcher on Linux and macOS): uploaded with the shard's logs, read by
  # tools/ci_times.py to refresh tools/ci_times.tsv and to find the tests that wait instead of compute
  ONAIR_TESTTIME_LOG: ${{ github.workspace }}/testtime.log
  QA_TIMING_LOG: ${{ github.workspace }}/qatime.log   # test_qa_sweep: wall seconds and tries per mode
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  lint:
    name: Lint (seconds)   # the quick gate (tools/gate/run.sh); every job below waits for it. The name stays: it is a required check.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:   # the shard matrices of the jobs below, sized by the selected tests' measured seconds (tools/ci_plan.py)
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      fanout: ${{ steps.plan.outputs.fanout }}
      fanout_linux: ${{ steps.plan.outputs.fanout_linux }}
      fanout_macos: ${{ steps.plan.outputs.fanout_macos }}
      compile_linux: ${{ steps.plan.outputs.compile_linux }}
      compile_macos: ${{ steps.plan.outputs.compile_macos }}
      fanout_windows: ${{ steps.plan.outputs.fanout_windows }}
      compile_windows: ${{ steps.plan.outputs.compile_windows }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Quick gate
        run: tools/gate/run.sh
      # a configure with the release options (no compile): finds a duplicate target, a bad glob or a missing source before a release build does
      - name: Install dependencies (the .deb files cached, as the shards)
        uses: ./.github/actions/linux-deps
      - name: CMake configure (release options)
        run: |
          cmake -S . -B build-configure -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DDECT2_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Plan the shards (as many as the selected tests need, about 10 minutes of tests each)
        id: plan
        run: |
          BASE="$BASE_IN"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=origin/main;; esac
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || BASE=origin/main
          python3 tools/ci_plan.py --build-dir build-configure --scope "$SCOPE" --base "$BASE" --times tools/ci_times.tsv --platforms "${{ inputs.platforms || 'all' }}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The compile split (docs/CI-FAST.md (4.7)): when the selection reaches the core, every shard needs the same 2200 core files and many of the
  # same tests, and on a cold cache each compiled all of them on its own 3-4 cores. Part k of N compiles every N-th object file of the whole
  # selection (tools/ci_objs.py) into a ccache file store of its own; the shards read all the parts (read-only) before they build.
  compile-linux:
    needs: lint
    if: needs.lint.outputs.fanout_linux == '1'
    name: compile ${{ matrix.plat }} ${{ matrix.part }}/${{ matrix.of }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lint.outputs.compile_linux) }}   # tools/ci_plan.py
    env:
      # what this part compiles also goes here; the shards restore it at the same path (the cache version includes the path: saved from
      # another directory, the same key was "not found", run 45994391303)
      CCACHE_REMOTE_STORAGE: "file://${{ github.workspace }}/.ccache-p${{ matrix.part }}"
    steps:
      - name: Free disk space (Linux, in the background while the next steps run)
        if: runner.os == 'Linux'
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: tools/release/retry.sh brew install cmake ninja pkg-config ccache hackrf soapysdr libusb ffmpeg glfw
      - name: Restore ccache (the warm-up's, from main)
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-warm-${{ github.sha }}
          restore-keys: ccache-${{ matrix.plat }}-warm-
      - name: Configure (the shards' exact flags)
        run: |
          mkdir -p .ccache-p${{ matrix.part }}
          LD=""; [ "$RUNNER_OS" = Linux ] && LD="-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DCMAKE_TEST_LAUNCHER=python3;$PWD/tools/ci_testtime.py" $LD
      - name: Compile this part of the selection
        run: |
          BASE="$BASE_IN"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=origin/main;; esac
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || BASE=origin/main
          python3 tools/ci_select.py --build-dir build --base "$BASE" --scope "$SCOPE" $([ "${{ matrix.plat }}" = linux ] || echo --no-slow) --shard 1/1 --out sel > /dev/null
          ccache -z
          python3 tools/ci_objs.py --build-dir build --targets sel/targets.txt $([ "${{ matrix.plat }}" = linux ] && echo "--extra dect2") --part ${{ matrix.part }}/${{ matrix.of }} --run -j 4
          ccache -s
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache-p${{ matrix.part }}
          key: ccache-${{ matrix.plat }}-part${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

  compile-macos:
    needs: lint
    if: needs.lint.outputs.fanout_macos == '1'
    name: compile ${{ matrix.plat }} ${{ matrix.part }}/${{ matrix.of }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lint.outputs.compile_macos) }}   # tools/ci_plan.py
    env:
      # what this part compiles also goes here; the shards restore it at the same path (the cache version includes the path: saved from
      # another directory, the same key was "not found", run 45994391303)
      CCACHE_REMOTE_STORAGE: "file://${{ github.workspace }}/.ccache-p${{ matrix.part }}"
    steps:
      - name: Free disk space (Linux, in the background while the next steps run)
        if: runner.os == 'Linux'
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: tools/release/retry.sh brew install cmake ninja pkg-config ccache hackrf soapysdr libusb ffmpeg glfw
      - name: Restore ccache (the warm-up's, from main)
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-warm-${{ github.sha }}
          restore-keys: ccache-${{ matrix.plat }}-warm-
      - name: Configure (the shards' exact flags)
        run: |
          mkdir -p .ccache-p${{ matrix.part }}
          LD=""; [ "$RUNNER_OS" = Linux ] && LD="-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DCMAKE_TEST_LAUNCHER=python3;$PWD/tools/ci_testtime.py" $LD
      - name: Compile this part of the selection
        run: |
          BASE="$BASE_IN"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=origin/main;; esac
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || BASE=origin/main
          python3 tools/ci_select.py --build-dir build --base "$BASE" --scope "$SCOPE" $([ "${{ matrix.plat }}" = linux ] || echo --no-slow) --shard 1/1 --out sel > /dev/null
          ccache -z
          python3 tools/ci_objs.py --build-dir build --targets sel/targets.txt $([ "${{ matrix.plat }}" = linux ] && echo "--extra dect2") --part ${{ matrix.part }}/${{ matrix.of }} --run -j 4
          ccache -s
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache-p${{ matrix.part }}
          key: ccache-${{ matrix.plat }}-part${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

  linux-shards:
    needs: [lint, compile-linux]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.compile-linux.result != 'failure' }}   # compile: success, or skipped (small change)
    name: ${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # a hung test ends at its ctest timeout; a job never holds a runner for hours (the old nightly held 13 for 6 h)
    strategy:
      fail-fast: false
      # at most 9 Linux + 4 macOS + 4 Windows shards + the app job at once: 2-3 of the 20 free runners stay free for workers' quick.yml
      # checks, which otherwise waited behind a full run
      max-parallel: 9
      matrix: ${{ fromJSON(needs.lint.outputs.linux) }}
    steps:
      - name: Free disk space (Linux, in the background while the next steps run)
        if: runner.os == 'Linux'
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: tools/release/retry.sh brew install cmake ninja pkg-config ccache hackrf soapysdr libusb ffmpeg glfw
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.plat }}-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ matrix.plat }}-s${{ matrix.shard }}-
            ccache-${{ matrix.plat }}-warm-
            ccache-${{ matrix.plat }}-
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p1, key: "ccache-${{ matrix.plat }}-part1-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p2, key: "ccache-${{ matrix.plat }}-part2-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p3, key: "ccache-${{ matrix.plat }}-part3-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p4, key: "ccache-${{ matrix.plat }}-part4-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p5, key: "ccache-${{ matrix.plat }}-part5-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p6, key: "ccache-${{ matrix.plat }}-part6-${{ github.run_id }}-${{ github.run_attempt }}" }
      # the compile parts hold only what the compile jobs did not find in this warm cache: merged into .ccache too (files by content hash)
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache, key: "ccache-${{ matrix.plat }}-warm-${{ github.sha }}", restore-keys: "ccache-${{ matrix.plat }}-warm-" }
      - name: Read the compile jobs' ccache parts (tools/ci_objs.py)
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        run: |
          R=""; for k in 1 2 3 4 5 6; do [ -d ".ccache-p$k" ] && R="$R file://$PWD/.ccache-p$k|read-only=true"; done
          echo "CCACHE_REMOTE_STORAGE=${R# }" >> "$GITHUB_ENV"; echo "ccache parts:${R:- none}"
      - name: Zero the ccache counters (the statistics step then shows this run's hit rate)
        run: ccache -z
      - name: Configure
        run: |
          LD=""; [ "$RUNNER_OS" = Linux ] && LD="-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DCMAKE_TEST_LAUNCHER=python3;$PWD/tools/ci_testtime.py" $LD
      - name: Select the tests of this shard
        run: |
          BASE="$BASE_IN"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=origin/main;; esac
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || BASE=origin/main
          python3 tools/ci_select.py --build-dir build --base "$BASE" --scope "$SCOPE" $([ "${{ matrix.plat }}" = linux ] || echo --no-slow) --shard ${{ matrix.shard }}/${{ matrix.of }} --times tools/ci_times.tsv --plat ${{ matrix.plat }} --out sel | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the selected targets
        run: cmake --build build -j 4 --target $(tr -d "\r" < sel/targets.txt)
      - name: ccache statistics
        if: always()
        run: ccache -s
      - name: Save ccache
        if: always() && env.SAVE_CACHE == '1'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
      # the socket / thread timing tests (label "timing") on their own, two at a time, a failed one run once more
      - name: Test (fast tests)
        run: test -n "$ONAIR_TEST_LONG" || unset ONAIR_TEST_LONG; ctest --test-dir build -j 4 -R "$(cat sel/fast.regex)" --output-on-failure --timeout "$TEST_TIMEOUT" --output-log ctest-fast.log
      - name: Test (timing tests, a failure retried once)
        if: success() || failure()
        run: test -n "$ONAIR_TEST_LONG" || unset ONAIR_TEST_LONG; ctest --test-dir build -j 2 -R "$(cat sel/timing.regex)" --repeat until-pass:2 --output-on-failure --timeout "$TEST_TIMEOUT" --output-log ctest-timing.log
      - name: Tests that needed a retry (report only)
        if: always()
        run: python3 tools/ci_flaky_report.py ctest-timing.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: CPU figures (CPUCAL)
        if: always()
        run: grep -h CPUCAL ctest-fast.log ctest-timing.log > cpucal.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "cpucal-${{ matrix.name }}-${{ matrix.shard }}", path: "cpucal.txt\nctest-fast.log\nctest-timing.log\nsel/summary.txt\ntesttime.log\nqatime.log", if-no-files-found: ignore }


  macos-shards:
    needs: [lint, compile-macos]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.compile-macos.result != 'failure' && inputs.platforms != 'linux' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}   # main: Linux only (a push to main is replaced by the next merge within the hour); integ-*, tags, dispatch and the nightly Full CI run all three
    name: ${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90   # a hung test ends at its ctest timeout; a job never holds a runner for hours (the old nightly held 13 for 6 h)
    strategy:
      fail-fast: false
      # up to four shards (tools/ci_plan.py): the free plan runs 5 macOS jobs at once
      matrix: ${{ fromJSON(needs.lint.outputs.macos) }}
    steps:
      - name: Free disk space (Linux, in the background while the next steps run)
        if: runner.os == 'Linux'
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: tools/release/retry.sh brew install cmake ninja pkg-config ccache hackrf soapysdr libusb ffmpeg glfw
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.plat }}-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-${{ matrix.plat }}-s${{ matrix.shard }}-
            ccache-${{ matrix.plat }}-warm-
            ccache-${{ matrix.plat }}-
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p1, key: "ccache-${{ matrix.plat }}-part1-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p2, key: "ccache-${{ matrix.plat }}-part2-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p3, key: "ccache-${{ matrix.plat }}-part3-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p4, key: "ccache-${{ matrix.plat }}-part4-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p5, key: "ccache-${{ matrix.plat }}-part5-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache-p6, key: "ccache-${{ matrix.plat }}-part6-${{ github.run_id }}-${{ github.run_attempt }}" }
      # the compile parts hold only what the compile jobs did not find in this warm cache: merged into .ccache too (files by content hash)
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        with: { path: .ccache, key: "ccache-${{ matrix.plat }}-warm-${{ github.sha }}", restore-keys: "ccache-${{ matrix.plat }}-warm-" }
      - name: Read the compile jobs' ccache parts (tools/ci_objs.py)
        if: needs.lint.outputs[format('fanout_{0}', matrix.plat)] == '1'
        run: |
          R=""; for k in 1 2 3 4 5 6; do [ -d ".ccache-p$k" ] && R="$R file://$PWD/.ccache-p$k|read-only=true"; done
          echo "CCACHE_REMOTE_STORAGE=${R# }" >> "$GITHUB_ENV"; echo "ccache parts:${R:- none}"
      - name: Zero the ccache counters (the statistics step then shows this run's hit rate)
        run: ccache -z
      - name: Configure
        run: |
          LD=""; [ "$RUNNER_OS" = Linux ] && LD="-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DCMAKE_TEST_LAUNCHER=python3;$PWD/tools/ci_testtime.py" $LD
      - name: Select the tests of this shard
        run: |
          BASE="$BASE_IN"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=origin/main;; esac
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || BASE=origin/main
          python3 tools/ci_select.py --build-dir build --base "$BASE" --scope "$SCOPE" $([ "${{ matrix.plat }}" = linux ] || echo --no-slow) --shard ${{ matrix.shard }}/${{ matrix.of }} --times tools/ci_times.tsv --plat ${{ matrix.plat }} --out sel | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the selected targets
        run: cmake --build build -j 4 --target $(tr -d "\r" < sel/targets.txt)
      - name: ccache statistics
        if: always()
        run: ccache -s
      - name: Save ccache
        if: always() && env.SAVE_CACHE == '1'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.plat }}-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
      # the socket / thread timing tests (label "timing") on their own, two at a time, a failed one run once more
      - name: Test (fast tests)
        run: test -n "$ONAIR_TEST_LONG" || unset ONAIR_TEST_LONG; ctest --test-dir build -j 4 -R "$(cat sel/fast.regex)" --output-on-failure --timeout "$TEST_TIMEOUT" --output-log ctest-fast.log
      - name: Test (timing tests, a failure retried once)
        if: success() || failure()
        run: test -n "$ONAIR_TEST_LONG" || unset ONAIR_TEST_LONG; ctest --test-dir build -j 2 -R "$(cat sel/timing.regex)" --repeat until-pass:2 --output-on-failure --timeout "$TEST_TIMEOUT" --output-log ctest-timing.log
      - name: Tests that needed a retry (report only)
        if: always()
        run: python3 tools/ci_flaky_report.py ctest-timing.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: CPU figures (CPUCAL)
        if: always()
        run: grep -h CPUCAL ctest-fast.log ctest-timing.log > cpucal.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "cpucal-${{ matrix.name }}-${{ matrix.shard }}", path: "cpucal.txt\nctest-fast.log\nctest-timing.log\nsel/summary.txt\ntesttime.log\nqatime.log", if-no-files-found: ignore }


  # Windows compile split: as compile-linux/-macos, in the shards' MSYS2 UCRT64 environment; ccache's file store takes file:///D:/... there
  # (the other URL forms failed or stored nothing, probe in run 46003088536)
  compile-windows:
    needs: lint
    if: needs.lint.outputs.fanout_windows == '1'
    name: compile windows ${{ matrix.part }}/${{ matrix.of }}
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lint.outputs.compile_windows) }}   # tools/ci_plan.py
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64   # the MINGW64 environment has no hackrf and soapysdr packages
          update: true
          install: >-
            git python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-glfw mingw-w64-ucrt-x86_64-hackrf mingw-w64-ucrt-x86_64-soapysdr mingw-w64-ucrt-x86_64-libiconv mingw-w64-ucrt-x86_64-python
      - name: Restore ccache (the warm-up's, from main)
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-windows-warm-${{ github.sha }}
          restore-keys: ccache-windows-warm-
      - name: Configure (the shards' exact flags) and compile this part of the selection
        run: |
          mkdir -p .ccache-p${{ matrix.part }}
          export CCACHE_REMOTE_STORAGE="file:///$(cygpath -m "$PWD")/.ccache-p${{ matrix.part }}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          BASE="$BASE_IN"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=origin/main;; esac
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || BASE=origin/main
          python tools/ci_select.py --build-dir build --base "$BASE" --scope "$SCOPE" --no-slow --shard 1/1 --out sel > /dev/null
          ccache -z
          python tools/ci_objs.py --build-dir build --targets sel/targets.txt --extra dect2 --part ${{ matrix.part }}/${{ matrix.of }} --run -j 4
          ccache -s
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache-p${{ matrix.part }}
          key: ccache-windows-part${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

  windows-shards:
    needs: [lint, compile-windows]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.compile-windows.result != 'failure' && inputs.platforms != 'linux' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}   # main: Linux only (a push to main is replaced by the next merge within the hour); integ-*, tags, dispatch and the nightly Full CI run all three
    name: Windows shard ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.lint.outputs.windows) }}
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64   # the MINGW64 environment has no hackrf and soapysdr packages
          update: true
          install: >-
            git python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ccache mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-glfw mingw-w64-ucrt-x86_64-hackrf mingw-w64-ucrt-x86_64-soapysdr mingw-w64-ucrt-x86_64-libiconv mingw-w64-ucrt-x86_64-python
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-windows-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            ccache-windows-s${{ matrix.shard }}-
            ccache-windows-warm-
            ccache-windows-
      - name: Zero the ccache counters
        run: ccache -z
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_windows == '1'
        with: { path: .ccache, key: "ccache-windows-warm-${{ github.sha }}", restore-keys: "ccache-windows-warm-" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_windows == '1'
        with: { path: .ccache-p1, key: "ccache-windows-part1-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_windows == '1'
        with: { path: .ccache-p2, key: "ccache-windows-part2-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_windows == '1'
        with: { path: .ccache-p3, key: "ccache-windows-part3-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_windows == '1'
        with: { path: .ccache-p4, key: "ccache-windows-part4-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_windows == '1'
        with: { path: .ccache-p5, key: "ccache-windows-part5-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_windows == '1'
        with: { path: .ccache-p6, key: "ccache-windows-part6-${{ github.run_id }}-${{ github.run_attempt }}" }
      - name: Read the compile jobs' ccache parts (tools/ci_objs.py)
        if: needs.lint.outputs.fanout_windows == '1'
        run: |
          W=$(cygpath -m "$PWD"); R=""; for k in 1 2 3 4 5 6; do [ -d ".ccache-p$k" ] && R="$R file:///$W/.ccache-p$k|read-only=true"; done
          echo "CCACHE_REMOTE_STORAGE=${R# }" >> "$GITHUB_ENV"; echo "ccache parts:${R:- none}"
      - name: Probe the ccache file storage URL forms on Windows (report only)
        continue-on-error: true
        run: |
          mkdir -p probe && cd probe && printf 'int f(){return 1;}\n' > a.c
          W=$(cygpath -m "$PWD")
          for u in "file:$W/st" "file:///$W/st" "file://$W/st" "file:/$W/st"; do
            rm -rf st; mkdir st
            if CCACHE_DIR="$W/l" CCACHE_REMOTE_STORAGE="$u" ccache gcc -c a.c -o a.o 2> err.txt; then
              n=$(find st -type f | wc -l); echo "PROBE $u: ok, $n files in the store"
            else echo "PROBE $u: $(head -c 200 err.txt)"; fi
          done
      - name: Configure, select and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          BASE="$BASE_IN"; case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=origin/main;; esac
          git rev-parse --verify -q "$BASE^{commit}" > /dev/null || BASE=origin/main
          python tools/ci_select.py --build-dir build --base "$BASE" --scope "$SCOPE" --no-slow --shard ${{ matrix.shard }}/${{ matrix.of }} --times tools/ci_times.tsv --plat windows --out sel
          T=$(tr -d "\r" < sel/targets.txt); [ ${{ matrix.shard }} = 1 ] && T="$T dect2"
          cmake --build build -j 4 --target $T
      - name: ccache statistics
        if: always()
        run: ccache -s
      - name: Save ccache
        if: always() && env.SAVE_CACHE == '1'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-windows-s${{ matrix.shard }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
      # some tests write to /tmp, which a native Windows program reads as \\tmp on the current drive: it only existed when an earlier test
      # happened to create it, so with shards the order changed and the pcap / CSV / IQ file tests failed (run 42368655094)
      - name: Create /tmp for the native tests
        run: mkdir -p /d/tmp /c/tmp
      - name: Test (fast tests)
        run: test -n "$ONAIR_TEST_LONG" || unset ONAIR_TEST_LONG; ctest --test-dir build -j 4 -R "$(cat sel/fast.regex)" --output-on-failure --timeout "$TEST_TIMEOUT" --output-log ctest-fast.log
      - name: Test (timing tests, a failure retried once)
        if: success() || failure()
        run: test -n "$ONAIR_TEST_LONG" || unset ONAIR_TEST_LONG; ctest --test-dir build -j 2 -R "$(cat sel/timing.regex)" --repeat until-pass:2 --output-on-failure --timeout "$TEST_TIMEOUT" --output-log ctest-timing.log
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "cpucal-Windows-${{ matrix.shard }}", path: "ctest-fast.log\nctest-timing.log\nsel/summary.txt", if-no-files-found: ignore }

  gl31:
    needs: [lint, compile-linux]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.compile-linux.result != 'failure' }}
    name: "App: OpenGL 3.1 software run (Raspberry Pi limits)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/linux-deps
        with: { extra: "xvfb libgl1-mesa-dri", set-name: gl31 }
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-gl31-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-gl31-
      # the Linux compile jobs compile the app's objects too (tools/ci_objs.py --extra dect2): this build is then links
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_linux == '1'
        with: { path: .ccache, key: "ccache-linux-warm-${{ github.sha }}", restore-keys: "ccache-linux-warm-" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_linux == '1'
        with: { path: .ccache-p1, key: "ccache-linux-part1-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_linux == '1'
        with: { path: .ccache-p2, key: "ccache-linux-part2-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_linux == '1'
        with: { path: .ccache-p3, key: "ccache-linux-part3-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_linux == '1'
        with: { path: .ccache-p4, key: "ccache-linux-part4-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_linux == '1'
        with: { path: .ccache-p5, key: "ccache-linux-part5-${{ github.run_id }}-${{ github.run_attempt }}" }
      - uses: actions/cache/restore@v6
        if: needs.lint.outputs.fanout_linux == '1'
        with: { path: .ccache-p6, key: "ccache-linux-part6-${{ github.run_id }}-${{ github.run_attempt }}" }
      - name: Read the compile jobs' ccache parts
        if: needs.lint.outputs.fanout_linux == '1'
        run: |
          R=""; for k in 1 2 3 4 5 6; do [ -d ".ccache-p$k" ] && R="$R file://$PWD/.ccache-p$k|read-only=true"; done
          echo "CCACHE_REMOTE_STORAGE=${R# }" >> "$GITHUB_ENV"; echo "ccache parts:${R:- none}"
      - run: ccache -z
      - name: Build the app only
        run: |
          # the tests stay on in the configure (only dect2 is built): with them off the core compiles without -fPIC, and none of the compile
          # parts' or the warm-up's objects matched (2350 of 3016 files had other flags; 22 min build in run 46003088536)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECT2_BUILD_APP=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_FLAGS=-g0 -DCMAKE_CXX_FLAGS=-g0 -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j 4 --target dect2
          ccache -s
      - uses: actions/cache/save@v6
        if: always() && env.SAVE_CACHE == '1'
        with:
          path: .ccache
          key: ccache-gl31-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.sha }}
      - name: Run at OpenGL 3.1
        run: |
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.1 MESA_GLSL_VERSION_OVERRIDE=140 MESA_DEBUG=1 DECT2_MAX_TEXTURE=4096 \
            timeout 120 xvfb-run -a -s "-screen 0 1600x1000x24" ./build/dect2 --hidden --mute --shot "$GITHUB_WORKSPACE/shot-gl31.png" > gl31.log 2>&1
          echo "exit $?"
          tail -40 gl31.log
          [ -f "$GITHUB_WORKSPACE/shot-gl31.png" ] || { echo "no frame drawn"; exit 1; }
          if grep -q 'Mesa: error\|GL_INVALID' gl31.log; then echo "OpenGL errors"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: linux-gl31-shot, path: "shot-gl31.png\ngl31.log", if-no-files-found: ignore }

  # required check "Linux x86_64": passes when every shard of it passed
  gather-linux:
    name: Linux x86_64
    needs: [linux-shards, gl31]
    if: ${{ !cancelled() }}   # a shard failing or skipped still fails this; a run replaced by a newer one has nothing to gather
    runs-on: ubuntu-24.04
    steps:
      # the failed tests and the command that reruns only them (tools/ci_failed.py): fix, rerun those in minutes, then the full scope once
      - uses: actions/checkout@v7
        if: always()
        with: { sparse-checkout: tools }
      - uses: actions/download-artifact@v7
        if: always()
        continue-on-error: true
        with: { pattern: "cpucal-Linux*", path: shard-logs }
      - name: Failed tests and the rerun command
        if: always()
        run: python3 tools/ci_failed.py --logs shard-logs --os linux --ref "${{ github.ref_name }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import sys,json; r=json.load(sys.stdin); bad=[k for k,v in r.items() if v['result']!='success']; print('results',{k:v['result'] for k,v in r.items()}); sys.exit(1 if bad else 0)"

