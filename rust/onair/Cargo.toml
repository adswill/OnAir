[package]
name = "onair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "OnAir Rust code as ONE static library (libonair_rs.a): re-exports every module's extern \"C\" functions"

[lib]
name = "onair_rs"
crate-type = ["staticlib", "rlib"]

[features]
bare = []

[dependencies]
onair_common = { path = "../onair_common" }
